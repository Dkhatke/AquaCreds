name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install workspace (dev group, no ML)
        run: uv sync --frozen --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term --cov-fail-under=80

  stack-smoke:
    name: Compose stack smoke test
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v7
      - name: Start stack
        run: |
          docker compose up --build -d --wait db valkey s3 api
          docker compose up -d worker
      - name: Readiness + API → queue → worker round trip
        run: |
          curl -fsS --retry 15 --retry-delay 2 --retry-all-errors http://localhost:8000/readyz
          echo
          for i in $(seq 1 10); do
            if curl -fsS -X POST http://localhost:8000/api/v1/system/ping-worker; then echo; exit 0; fi
            sleep 3
          done
          exit 1
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  images:
    name: Image (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: python
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker]
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        if: env.PUSH == 'true'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/dkhatke/aquacreds-${{ matrix.target }}
          tags: |
            type=sha,format=short
            type=raw,value=main,enable=${{ env.PUSH == 'true' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/python.Dockerfile
          target: ${{ matrix.target }}
          # PRs: fast amd64 build check. main: multi-arch (Oracle Always Free is arm64) + push.
          platforms: ${{ env.PUSH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
