name: Deploy

# Deploys the GHCR images built by ci.yml (on `main`) to the Oracle VM over SSH.
# INERT until these repository (or `production` environment) secrets exist; without them the run
# ends with a notice and touches nothing:
#   DEPLOY_HOST         VM public IP or hostname
#   DEPLOY_USER         SSH user created by infra/scripts/bootstrap-vm.sh (default name: deploy)
#   DEPLOY_SSH_KEY      private key (ed25519) whose public half is in that user's authorized_keys
#   DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan -t ed25519 <host>`, verified against the VM console
# Optional repository variables: DEPLOY_DIR (default /opt/aquacreds), API_DOMAIN (public readiness check),
# WEB_DOMAIN (public check that the web app answers).
# Runbook: docs/DEPLOYMENT.md

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: sha-<7 chars> of the selected ref). An older sha-… tag rolls back."
        required: false
        type: string

permissions:
  contents: read
  packages: read

# Never run two deploys at once, and never cancel one half-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.secrets.outputs.enabled }}
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Check deploy secrets
        id: secrets
        env:
          HAS_HOST: ${{ secrets.DEPLOY_HOST != '' }}
          HAS_USER: ${{ secrets.DEPLOY_USER != '' }}
          HAS_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
          HAS_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS != '' }}
        run: |
          if [[ "$HAS_HOST" == true && "$HAS_USER" == true && "$HAS_KEY" == true && "$HAS_KNOWN_HOSTS" == true ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Deploy skipped::Set DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS secrets to enable deployments (see docs/DEPLOYMENT.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          tag="${INPUT_TAG:-sha-${GITHUB_SHA::7}}"
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::invalid image tag '$tag'"
            exit 1
          fi
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Deploying image tag: $tag (ref ${GITHUB_REF_NAME}, commit ${GITHUB_SHA})"

  deploy:
    name: Deploy ${{ needs.preflight.outputs.image_tag }}
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
    env:
      IMAGE_TAG: ${{ needs.preflight.outputs.image_tag }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/aquacreds' }}
      API_DOMAIN: ${{ vars.API_DOMAIN }}
      WEB_DOMAIN: ${{ vars.WEB_DOMAIN }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ci.yml builds images only for commits on main; a tag pushed right after a merge may arrive
      # before that build finishes, so wait (up to 40 min) for all three images (api, worker, web) incl. linux/arm64.
      - name: Wait for images in GHCR
        run: |
          for image in api worker web; do
            ref="ghcr.io/dkhatke/aquacreds-${image}:${IMAGE_TAG}"
            for attempt in $(seq 1 80); do
              if manifest="$(docker manifest inspect "$ref" 2>/dev/null)"; then
                if grep -q '"architecture": *"arm64"' <<<"$manifest"; then
                  echo "found $ref (linux/arm64)"
                  continue 2
                fi
                echo "::error::$ref exists but has no linux/arm64 variant"
                exit 1
              fi
              echo "waiting for $ref (attempt $attempt/80)"
              sleep 30
            done
            echo "::error::$ref not found in GHCR. Is the tagged commit on main and did CI's image job succeed?"
            exit 1
          done

      - name: Configure SSH (strict host key checking)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          {
            echo "Host vm"
            echo "  HostName $HOST"
            echo "  User $USER_NAME"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts"
            echo "  ServerAliveInterval 30"
            echo "  ConnectTimeout 20"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh vm 'docker compose version'

      - name: Sync compose files and scripts to the VM
        run: |
          # shellcheck disable=SC2029  # expanding on the runner is intended; values are %q-quoted
          git archive --format=tar HEAD infra/compose infra/scripts \
            | ssh vm "$(printf 'mkdir -p %q && tar -x -C %q' "$DEPLOY_DIR" "$DEPLOY_DIR")"

      - name: Log the VM in to GHCR (short-lived job token)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          # shellcheck disable=SC2029  # expanding on the runner is intended; values are %q-quoted
          printf '%s' "$GHCR_TOKEN" | ssh vm "$(printf 'docker login ghcr.io -u %q --password-stdin' "$ACTOR")"

      - name: Deploy (pull, migrate, up, wait for /readyz, auto-rollback)
        run: |
          # shellcheck disable=SC2029  # expanding on the runner is intended; values are %q-quoted
          ssh vm "$(printf '%q %q' "$DEPLOY_DIR/infra/scripts/deploy.sh" "$IMAGE_TAG")"

      - name: Public readiness check
        if: env.API_DOMAIN != ''
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "https://${API_DOMAIN}/readyz"

      - name: Public web check
        if: env.WEB_DOMAIN != ''
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors -o /dev/null "https://${WEB_DOMAIN}/"

      - name: Log the VM out of GHCR
        if: always()
        run: ssh vm 'docker logout ghcr.io' || true

      - name: Remove SSH material
        if: always()
        run: rm -rf ~/.ssh
