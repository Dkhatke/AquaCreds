# AquaCreds — local development stack.   Usage: `make dev`  (or `docker compose up --build -d`)
# Production compose lives in infra/compose/ (Phase 9).
name: aquacreds

x-python-env: &python-env
  APP_ENV: development
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aquacreds}:${POSTGRES_PASSWORD:-aquacreds}@db:5432/${POSTGRES_DB:-aquacreds}
  REDIS_URL: redis://valkey:6379/0
  S3_ENDPOINT_URL: http://s3:8333
  S3_BUCKET: ${S3_BUCKET:-aquacreds-dev}
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:8333}
  # Must match infra/compose/seaweedfs/s3.json (dev-only credentials).
  S3_ACCESS_KEY_ID: aquadev
  S3_SECRET_ACCESS_KEY: aquadev-secret
  JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8081}

x-python-build: &python-build
  context: .
  dockerfile: infra/docker/python.Dockerfile
  target: dev

x-python-volumes: &python-volumes
  - ./packages:/src/packages
  - ./services:/src/services

services:
  db:
    # Multi-arch PostGIS (the official postgis/postgis image is amd64-only).
    image: imresamu/postgis:17-3.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aquacreds}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aquacreds}
      POSTGRES_DB: ${POSTGRES_DB:-aquacreds}
    ports: ["${DB_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8.1-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    ports: ["${VALKEY_PORT:-6379}:6379"]
    volumes: [valkeydata:/data]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    # S3-compatible storage for development (production uses Cloudflare R2).
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-ip=s3", "-ip.bind=0.0.0.0", "-s3", "-s3.config=/etc/seaweedfs/s3.json"]
    ports: ["${S3_PORT:-8333}:8333"]
    volumes:
      - s3data:/data
      - ./infra/compose/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    build: *python-build
    image: aquacreds-python-dev:local
    command: ["sh", "-c", "aqua-api migrate && aqua-api bootstrap"]
    environment: *python-env
    volumes: *python-volumes
    depends_on:
      db: { condition: service_healthy }
      s3: { condition: service_healthy }
    restart: "no"

  api:
    image: aquacreds-python-dev:local
    pull_policy: never
    command:
      - uvicorn
      - aqua_api.main:app
      - --host=0.0.0.0
      - --port=8000
      - --reload
      - --reload-dir=/src/services/api/src
      - --reload-dir=/src/packages/aqua_core/src
    environment: *python-env
    volumes: *python-volumes
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    image: aquacreds-python-dev:local
    pull_policy: never
    # watchfiles restarts the worker when Python source changes.
    command:
      - watchfiles
      - --filter=python
      - celery -A aqua_worker.celery_app worker --loglevel INFO -Q default,geo,ml,chain,reports --concurrency 2
      - /src/services/worker/src
      - /src/packages/aqua_core/src
      - /src/packages/aqua_geo/src
    environment: *python-env
    volumes: *python-volumes
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }

  beat:
    # Celery beat: schedules the nightly satellite ingestion (GEO_NIGHTLY_HOUR_UTC, default 20 =
    # 01:30 IST). Run exactly ONE beat process, or jobs are scheduled twice.
    image: aquacreds-python-dev:local
    pull_policy: never
    command: ["celery", "-A", "aqua_worker.celery_app", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    environment:
      <<: *python-env
      GEO_NIGHTLY_HOUR_UTC: ${GEO_NIGHTLY_HOUR_UTC:-20}
    volumes: *python-volumes
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }

volumes:
  pgdata:
  valkeydata:
  s3data:
