[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.7.0/",
    "forge-std/=dependencies/forge-std-1.17.0/src/",
]

[fuzz]
runs = 1000

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 5000

[dependencies]
"@openzeppelin-contracts" = "5.7.0"
forge-std = "1.17.0"

[soldeer]
remappings_generate = false
remappings_regenerate = false
