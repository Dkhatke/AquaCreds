# Reproducible data pipeline. `uv run dvc repro` re-runs only stages whose inputs changed.
# Remote storage (Cloudflare R2) is configured later with `dvc remote add` (see docs/DATASETS.md).
stages:
  download_coasttrain:
    cmd: uv run python ml/pipelines/download.py coasttrain_v1
    deps:
      - ml/pipelines/download.py
    outs:
      - data/raw/coasttrain

  download_gmw_v4_2020:
    cmd: uv run python ml/pipelines/download.py gmw_v4_2020
    deps:
      - ml/pipelines/download.py
    outs:
      - data/raw/gmw_v4

  download_gmw_v3_1996:
    cmd: uv run python ml/pipelines/download.py gmw_v3_1996
    deps:
      - ml/pipelines/download.py
    outs:
      - data/raw/gmw_v3

  labels_coasttrain:
    cmd: uv run python ml/pipelines/labels_coasttrain.py
    deps:
      - ml/pipelines/labels_coasttrain.py
      - data/raw/coasttrain
    outs:
      - data/interim/labels/coasttrain_aoi.parquet

  labels_build:
    cmd: uv run python -u ml/pipelines/labels_build.py
    deps:
      - ml/pipelines/labels_build.py
      - ml/pipelines/splits.py
      - data/interim/labels/coasttrain_aoi.parquet
      - data/raw/gmw_v4
    outs:
      - data/processed/labels.parquet
    metrics:
      - data/processed/labels_summary.json:
          cache: false
