[project]
name = "aqua-chain"
version = "0.1.0"
description = "AquaCreds blockchain integration: contract ABIs, typed web3 client, HD wallets, relayer and event indexer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aqua-core",
    "web3~=8.0",
    "eth-account~=0.14",
    "rfc8785~=0.1.4",
    "shapely~=2.2",
]

[tool.uv.sources]
aqua-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
