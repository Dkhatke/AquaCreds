[project]
name = "aqua-mrv"
version = "0.1.0"
description = "MRV report builder: plots → carbon engine → canonical hashed record + PDF/CSV/GeoJSON"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aqua-carbon",
    "pydantic~=2.14",
    "rfc8785~=0.1.4",
    "jinja2~=3.1",
    "weasyprint~=70.0",
]

[tool.uv.sources]
aqua-carbon = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
