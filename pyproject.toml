[project]
name = "aquacreds"
version = "0.1.0"
description = "AquaCreds v2: blue-carbon registry and MRV platform (uv workspace root)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest~=9.1",
    "pytest-asyncio~=1.4",
    "pytest-cov~=7.1",
    "httpx~=0.28.1",
    "testcontainers[postgres,redis]~=4.15",
    "ruff~=0.17.1",
    "mypy~=2.4",
    "types-shapely>=2.1.0",
    "pre-commit~=4.7",
    "pip-audit~=2.10",
]
# Research / training environment (local + Kaggle/Colab). Not installed in service images.
ml = [
    "numpy~=2.5",
    "pandas~=3.0",
    "xarray~=2026.9",
    "dask[array]~=2026.8",
    "rasterio~=1.5",
    "rioxarray~=0.23.0",
    "rio-cogeo~=7.0",
    "geopandas~=1.2",
    "pyogrio~=0.13.0",
    "shapely~=2.2",
    "pyproj~=3.8",
    "pystac~=1.15",
    "pystac-client~=0.9.0",
    "odc-stac~=0.5.3",
    "planetary-computer~=1.0",
    "h3~=4.5",
    "scipy~=1.18",
    "scikit-learn~=1.9",
    "lightgbm~=4.7",
    "xgboost~=3.4",
    "onnxruntime~=1.31",
    "onnx~=1.23",
    "optuna~=5.0",
    "mapie~=1.5",
    "shap~=0.54.0",
    "statsmodels~=0.15.0",
    "earthaccess~=0.19.0",
    "dvc[s3]~=3.67",
    "pyarrow>=21,<26",
    "s2cloudless~=1.7",
    "huggingface-hub~=2.2",
    "torch~=2.14",
    "torchvision~=0.29.0",
    "timm~=1.0",
    "open-clip-torch~=3.3",
    "pybioclip~=2.1",
    "segmentation-models-pytorch~=0.5.0",
    "torchgeo~=0.10.0",
    "lightning~=2.6",
    "mlflow~=3.17",
    "jupyterlab~=4.6",
    "ipykernel~=7.4",
    "matplotlib~=3.11",
    "seaborn~=0.13.2",
    "tqdm~=4.70",
    "pillow~=13.0",
    "exifread~=3.5",
    "imagehash~=4.3",
    "weasyprint~=70.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
aqua-core = { workspace = true }
aqua-api = { workspace = true }
aqua-worker = { workspace = true }
# CPU-only PyTorch wheels on Linux (much smaller); macOS uses PyPI wheels (with MPS).
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ---------------------------------------------------------------- tooling
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["_legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "C4", "PT"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["aqua_core", "aqua_api", "aqua_worker"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["packages/aqua_core/src", "services/api/src", "services/worker/src"]
mypy_path = ["packages/aqua_core/src", "services/api/src", "services/worker/src"]
exclude = ["/migrations/"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["aqua_worker.*", "aqua_api.queue", "aqua_api.routers.system"]
disallow_untyped_decorators = false
disallow_untyped_calls = false
disallow_any_unimported = false

[tool.pytest.ini_options]
testpaths = ["packages", "services"]
addopts = "--import-mode=importlib -ra"
pythonpath = ["services/api/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
# SQLAlchemy's asyncio layer runs code on greenlets; without this, coverage misses those lines.
concurrency = ["greenlet", "thread"]
source = ["aqua_core", "aqua_api", "aqua_worker"]
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = false
skip_covered = false
