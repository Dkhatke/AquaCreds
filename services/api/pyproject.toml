[project]
name = "aqua-api"
version = "0.1.0"
description = "AquaCreds HTTP API (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aqua-core",
    "aqua-chain",
    "fastapi~=0.146.0",
    "uvicorn[standard]~=0.54.0",
    "alembic~=1.20",
    "celery[redis]~=5.6",
    "orjson~=3.13",
    "pyjwt[crypto]~=2.15",
    "argon2-cffi~=25.1",
    "email-validator~=2.3",
    "geojson-pydantic~=2.2",
    "shapely~=2.2",
    "rfc8785~=0.1.4",
    "cryptography~=50.0",
    "pyotp~=2.10",
    "segno~=1.6.6",
    "jinja2~=3.1",
    "weasyprint~=70.0",
    # XYZ map tiles from the classification COGs (BSD-3; pulls rasterio, morecantile, numexpr)
    "rio-tiler~=9.4.12",
]

[project.scripts]
aqua-api = "aqua_api.cli:main"

[tool.uv.sources]
aqua-core = { workspace = true }
aqua-chain = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
