[project]
name = "aqua-worker"
version = "0.1.0"
description = "AquaCreds background workers (Celery): geo, ml, chain, reports"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aqua-core",
    "celery[redis]~=5.6",
    "watchfiles~=1.1",
    "pillow~=13.0",
    "imagehash~=4.3",
    "shapely~=2.2",
]

[tool.uv.sources]
aqua-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
